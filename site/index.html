<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f2a5c">
<title>KPTCL CMS · Survey Management (standalone demo)</title>
<style>:root{
  --navy:#0b2545;--navy-2:#13315c;--navy-3:#1c3f73;
  --primary:#1d5fd1;--primary-600:#164ca8;--primary-50:#eaf1fd;--primary-100:#d6e4fb;
  --ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e2e8f0;--line-2:#edf1f6;--bg:#f4f6fa;--card:#fff;
  --green:#15803d;--green-50:#e8f7ee;--amber:#b45309;--amber-50:#fef3e2;--red:#c62828;--red-50:#fdecec;
  --teal:#0e7c86;--teal-50:#e2f4f5;--violet:#5b21b6;--violet-50:#f1ebfd;
  --radius:14px;--shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);--shadow-lg:0 20px 50px rgba(15,23,42,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:700}h2{font-size:1.05rem;font-weight:700}h3{font-size:.95rem;font-weight:700}
p{margin:.4rem 0}
.muted{color:var(--muted)}.small{font-size:12.5px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app layout ---------- */
.layout{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#cfdcf0;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brandmark{display:flex;align-items:center;gap:12px;padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f5b93a,#f08a24);display:grid;place-items:center;color:#2b1700;box-shadow:0 6px 16px rgba(240,138,36,.35)}
.logo .ico{width:22px;height:22px;stroke-width:2.4}
.brandmark b{display:block;color:#fff;font-size:15px;letter-spacing:.01em}.brandmark span{font-size:12px;color:#93a9cc}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7f97bd;padding:10px 10px 6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#cfdcf0;padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#fff;color:var(--navy);font-weight:650;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.nav button.on .ico{color:var(--primary)}
.nav .count{margin-left:auto;background:#f08a24;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.sidebar .spacer{flex:1}
.usercard{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px}
.usercard .who{min-width:0}.usercard .who b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usercard .who span{font-size:11.5px;color:#93a9cc;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usercard .iconbtn{margin-left:auto;color:#cfdcf0;border-color:rgba(255,255,255,.15);background:transparent}
.usercard .iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#3b82f6,#1d4ed8);flex:none}
.avatar.lg{width:44px;height:44px;font-size:15px}

.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:18px 32px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.chip .ico{width:15px;height:15px}
.chip.poc{background:var(--violet-50);color:var(--violet);border-color:#e1d5fa;font-weight:600}
main{padding:28px 32px 48px;max-width:1360px;width:100%}

/* ---------- cards, kpis ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .ibox{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.card-h .sub{font-size:12.5px;color:var(--muted);font-weight:400}
.card-h .end{margin-left:auto}
.grid{display:grid;gap:20px}.cols2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.cols-even{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.kpi{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .ibox{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.kpi .ibox .ico{width:22px;height:22px}
.kpi b{font-size:1.65rem;line-height:1;display:block;letter-spacing:-.02em}.kpi span{font-size:12.5px;color:var(--muted)}
.t-amber{background:var(--amber-50);color:var(--amber)}.t-blue{background:var(--primary-50);color:var(--primary)}.t-green{background:var(--green-50);color:var(--green)}.t-teal{background:var(--teal-50);color:var(--teal)}.t-violet{background:var(--violet-50);color:var(--violet)}.t-red{background:var(--red-50);color:var(--red)}
.focus{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(120deg,#0f2f5c,#1d5fd1);color:#e6eefc;border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.focus h3{color:#fff;font-size:1rem;margin-bottom:6px}
.focus ul{margin:0;padding-left:18px}.focus li{margin:2px 0}
.focus .ibox{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;flex:none}
.focus .pylon{position:absolute;right:-30px;bottom:-40px;width:260px;opacity:.16}
.focus .pylon .pylon-lines{stroke:#fff}.focus .pylon .pylon-blocks{fill:none;stroke:#fff}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#eef2f7;color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.pill.blue{background:var(--primary-50);color:var(--primary)}.pill.amber{background:var(--amber-50);color:var(--amber)}.pill.green{background:var(--green-50);color:var(--green)}
.pill.red{background:var(--red-50);color:var(--red)}.pill.teal{background:var(--teal-50);color:var(--teal)}.pill.violet{background:var(--violet-50);color:var(--violet)}
.pill.plain::before{display:none}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:#eef2f7;color:var(--ink-2)}
.tag.portal{background:var(--violet-50);color:var(--violet)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;margin:0 -20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 20px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;background:#f8fafc;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover{background:#f6f9ff}
tr.row.sel{background:var(--primary-50);box-shadow:inset 3px 0 0 var(--primary)}
.code{font-weight:700;color:var(--ink)}
.cell-sub{font-size:12.5px;color:var(--muted)}
.datecell{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap}.datecell .ico{width:15px;height:15px;color:var(--muted)}

/* ---------- buttons, forms ---------- */
button,.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--primary);background:var(--primary);color:#fff;padding:9px 16px;cursor:pointer;transition:background .15s,box-shadow .15s,transform .05s;box-shadow:0 1px 2px rgba(29,95,209,.25)}
button:hover{background:var(--primary-600)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary-100);outline-offset:1px}
button.secondary{background:#fff;color:var(--ink-2);border-color:var(--line);box-shadow:none}
button.secondary:hover{background:#f5f7fb;border-color:#cfd8e3}
button.danger{background:#fff;color:var(--red);border-color:#f3c2c2;box-shadow:none}button.danger:hover{background:var(--red-50)}
button.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}button.danger.solid:hover{background:#a51f1f}
button.green{background:var(--green);border-color:var(--green)}button.green:hover{background:#106631}
button:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{padding:7px;border-radius:9px;background:#fff;color:var(--ink-2);border:1px solid var(--line);box-shadow:none}
.iconbtn:hover{background:#f5f7fb}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2);padding:4px 11px;box-shadow:none;border-radius:8px}
.btn-ghost:hover{background:#f5f7fb}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #d5dde8;border-radius:10px;background:#fff;color:var(--ink);transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:#b9c6d8}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:3px solid var(--primary-100)}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:13px;color:var(--ink-2)}
.err{color:var(--red);margin:8px 0;font-size:13px;min-height:1px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- notices ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--amber-50);border:1px solid #f6d7a6;color:#7a3e05;border-radius:12px;padding:12px 14px;font-size:13px;margin:12px 0}
.notice.red{background:var(--red-50);border-color:#f3c2c2;color:#8a1c1c}
.notice.blue{background:var(--primary-50);border-color:var(--primary-100);color:#123d85}
.notice .ico{margin-top:1px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:34px 16px;gap:8px}
.empty .ibox{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#f1f5f9;color:#94a3b8}
.empty .ibox .ico{width:26px;height:26px}

/* ---------- request detail ---------- */
.detail-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.detail-head h2{font-size:1.15rem}
.detail-head .end{margin-left:auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.fact{display:flex;gap:10px;align-items:flex-start;background:#f8fafc;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px}
.fact .ico{color:var(--muted);margin-top:2px}
.fact small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fact b{font-size:13.5px;font-weight:600}
.section-t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:20px 0 10px}

/* approval stepper (two rows, like the LC flow) */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);row-gap:18px;margin:4px 0 6px}
.step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.step .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #cbd5e1;color:#94a3b8;font-size:12px;font-weight:700;position:relative;z-index:1}
.step .dot .ico{width:15px;height:15px;stroke-width:3}
.step::after{content:"";position:absolute;top:15px;left:calc(50% + 17px);right:calc(-50% + 17px);height:2px;background:#dbe3ee}
.stepper .step:nth-child(5n)::after,.step:last-child::after{display:none}
.step.done{color:var(--ink-2)}.step.done .dot{background:var(--green);border-color:var(--green);color:#fff}.step.done::after{background:var(--green)}
.step.now{color:var(--primary)}.step.now .dot{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--primary-100)}
.step.stop{color:var(--red)}.step.stop .dot{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 5px var(--red-50)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 0 14px 26px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.timeline li::after{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline li.reject::before{border-color:var(--red)}.timeline li.good::before{border-color:var(--green);background:var(--green)}
.timeline b{text-transform:capitalize}
.timeline .when{font-size:12px;color:var(--muted)}
.timeline .say{margin-top:4px;background:#f8fafc;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-2)}
.timeline li.unread{font-weight:600}

/* ---------- login ---------- */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;background:#fff}
.auth-hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at -10% -10%,#2a5ea8 0%,transparent 60%),linear-gradient(160deg,var(--navy) 0%,var(--navy-3) 100%);color:#dbe6f7;padding:48px 56px;display:flex;flex-direction:column}
.auth-hero .brandmark{border:0;padding:0 0 40px}
.auth-hero h1{font-size:2.3rem;color:#fff;line-height:1.15;max-width:520px;letter-spacing:-.02em}
.auth-hero p.lead{font-size:1.05rem;color:#b9cbe6;max-width:500px;margin:14px 0 28px}
.features{display:grid;gap:14px;max-width:470px;position:relative;z-index:1}
.feature{display:flex;gap:12px;align-items:flex-start}
.feature .ibox{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#f5b93a;flex:none}
.feature b{color:#fff;display:block;font-size:14px}.feature span{font-size:13px;color:#a9bddb}
.auth-hero .pylon{position:absolute;right:-40px;bottom:-10px;width:470px;opacity:.22}
.pylon .pylon-lines{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pylon .pylon-blocks{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:4}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.auth-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow)}
.auth-card h2{font-size:1.4rem}
.auth-card button.wide{width:100%;margin-top:18px;padding:11px}
.demo{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.demo h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chips button{background:#f1f5f9;color:var(--ink-2);border:1px solid var(--line);padding:4px 10px;font-size:12px;font-weight:600;border-radius:999px;box-shadow:none}
.chips button:hover{background:var(--primary-50);color:var(--primary);border-color:var(--primary-100)}

/* ---------- toast ---------- */
.toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{display:flex;align-items:center;gap:10px;min-width:260px;max-width:420px;padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;box-shadow:var(--shadow-lg);font-weight:500;animation:tin .25s ease-out}
.toast.ok{background:#0f5132}.toast.bad{background:#8a1c1c}
.toast.out{opacity:0;transform:translateX(20px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;max-width:580px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.modal-h .ibox{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.modal.reject .modal-h .ibox{background:var(--red-50);color:var(--red)}
.modal-h .x{margin-left:auto}
.modal-b{padding:6px 22px 22px}
.selchip{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 12px;border-radius:999px;background:var(--teal-50);color:var(--teal);font-weight:600;font-size:12.5px}
.selchip .ico{width:15px;height:15px}

/* ---------- calendar ---------- */
.cal{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head strong{font-size:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px}
.cal-day{background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:9px;padding:8px 0;font-size:13px;font-weight:500;box-shadow:none}
.cal-day:hover:not(:disabled){background:var(--primary-50);border-color:var(--primary-100);color:var(--primary)}
.cal-day.booked{background:var(--amber-50);border-color:#f6c98a;color:var(--amber);font-weight:700}
.cal-day.full{background:repeating-linear-gradient(135deg,#fdecec 0 6px,#fbe0e0 6px 12px);border-color:#f3c2c2;color:var(--red);text-decoration:line-through}
.cal-day.selected,.cal-day.selected:hover{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--primary-100)}
.cal-day:disabled{opacity:.4;cursor:not-allowed}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:4px;border:1px solid var(--line);vertical-align:-1px}
.dot.booked{background:var(--amber-50);border-color:#f6c98a}.dot.full{background:var(--red-50);border-color:#f3c2c2}.dot.selected{background:var(--primary);border-color:var(--primary)}
.booklist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.booklist li{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px}

/* ---------- offers ---------- */
.offer{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}
.offer.open{border-color:var(--primary-100);background:linear-gradient(90deg,#f5f9ff,#fff)}
.distance{display:flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:72px;border-radius:14px;background:var(--teal-50);color:var(--teal);flex:none}
.distance b{font-size:1.2rem;line-height:1}.distance span{font-size:11px}
.offer .meta{flex:1;min-width:0}
.offer .meta .row2{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.offer .meta .row2 span{display:inline-flex;align-items:center;gap:5px}.offer .meta .row2 .ico{width:14px;height:14px}
.offer .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.status-big{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;margin:6px 0 12px}
.status-big .ibox{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.7)}
.status-big.on{background:var(--green-50);color:var(--green)}.status-big.off{background:#f1f5f9;color:var(--ink-2)}
.status-big b{display:block;font-size:15px}

/* ---------- portal ---------- */
.ptop{display:flex;align-items:center;gap:14px;padding:14px 32px;background:var(--navy);color:#cfdcf0}
.ptop .brandmark{border:0;margin:0;padding:0}
.ptop .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ptop .right b{color:#fff;font-size:13px;display:block}.ptop .right span{font-size:11.5px;color:#93a9cc}
.ptop button.secondary{background:transparent;color:#e2eaf7;border-color:rgba(255,255,255,.2)}
.ptop button.secondary:hover{background:rgba(255,255,255,.08)}
.phero{position:relative;overflow:hidden;background:linear-gradient(135deg,#13315c 0%,#1d5fd1 100%);color:#dbe6f7;padding:36px 32px 76px}
.phero h1{color:#fff;font-size:1.9rem;max-width:620px}.phero p{max-width:560px;color:#c3d4ee}
.phero .pylon{position:absolute;right:4%;bottom:-30px;width:330px;opacity:.25}
.pmain{max-width:1240px;margin:-52px auto 0;padding:0 32px 48px;position:relative}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.howto .s{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.howto .n{width:34px;height:34px;border-radius:10px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:800;flex:none}
.howto b{display:block;font-size:13.5px}.howto span{font-size:12px;color:var(--muted)}
.preq{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.preq .top{display:flex;align-items:center;gap:10px}
.track{display:grid;grid-template-columns:repeat(5,1fr);margin-top:14px}
.track .step::after{top:11px;left:calc(50% + 13px);right:calc(-50% + 13px)}
.track .step .dot{width:22px;height:22px;font-size:10px}
.track .step:nth-child(6n)::after{display:block}.track .step:last-child::after{display:none}
.track .step .dot .ico{width:12px;height:12px}

@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px}
  .sidebar .brandmark{border:0;margin:0;padding:0 8px 0 0}.navlabel,.sidebar .spacer{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}.nav button{width:auto;padding:8px 10px}
  .usercard{margin-left:auto}
  .cols2,.cols-even,.auth{grid-template-columns:1fr}
  .auth-hero{padding:32px}.auth-hero .pylon{width:300px}
  .howto{grid-template-columns:1fr 1fr}
  main{padding:20px 16px}.topbar{padding:14px 16px}
}
@media (max-width:560px){.facts,.field-row,.howto{grid-template-columns:1fr}.stepper{grid-template-columns:repeat(4,1fr)}.stepper .step:nth-child(5n)::after{display:block}.stepper .step:nth-child(4n)::after{display:none}}

/* ---------- polish ---------- */
.logo{color:#fff}.logo .ico{stroke:#fff;fill:rgba(255,255,255,.25)}
.nav button{justify-content:flex-start;box-shadow:none}
.nav button.on{box-shadow:0 6px 18px rgba(0,0,0,.18)}
.layout{background:linear-gradient(90deg,var(--navy) 0 256px,var(--bg) 256px)}
.grid{align-items:start}
th,td{padding:12px 14px}th:first-child,td:first-child{padding-left:20px}th:last-child,td:last-child{padding-right:20px}
.cols2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.auth-hero .pylon{width:380px;right:-50px;bottom:-16px;opacity:.16}
.phero>*{position:relative;z-index:1}
.phero .inner,.pmain{max-width:1240px;margin-left:auto;margin-right:auto}
.phero .inner{padding:0 0}
.phero .pylon{z-index:0}
@media (max-width:1000px){.layout{background:var(--bg)}}
.timeline b{text-transform:none}
.tablewrap td button{padding:6px 10px;font-size:12.5px;white-space:nowrap}
@media (max-width:700px){.auth-hero .features,.auth-hero .pylon,.auth-hero p.lead{display:none}.auth-hero h1{font-size:1.6rem}.auth-hero .brandmark{padding-bottom:20px}}

/* ---------- contact buttons, documents, files ---------- */
.cbtns{display:inline-flex;gap:6px;margin-left:auto;flex:none}
a.cbtn,button.cbtn{cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;border:1px solid var(--primary-100);background:var(--primary-50);color:var(--primary);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
a.cbtn:hover,button.cbtn:hover{background:var(--primary-100)}.cbtn .ico{width:15px;height:15px}
.contacts{display:grid;gap:8px}
.contact{display:flex;align-items:center;gap:12px;background:#f8fafc;border:1px solid var(--line-2);border-radius:12px;padding:8px 12px}
.contact.now{background:var(--amber-50);border-color:#f6d7a6}
.contact .avatar{width:32px;height:32px;font-size:12px}
.cinfo{min-width:0;display:flex;flex-direction:column}
.cinfo b{font-size:13.5px;line-height:1.3}.cinfo span,.cinfo small{font-size:12px;color:var(--muted)}
.cinfo .holds{font-size:11px;font-style:normal;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.04em}
.surveyor-card{display:flex;align-items:center;gap:14px;margin-top:16px;background:var(--teal-50);border:1px solid #bfe3e6;border-radius:14px;padding:12px 14px}
.surveyor-card .cinfo small{text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--teal)}
.docs{display:grid;gap:8px}
a.doc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none}
a.doc:hover{border-color:var(--primary-100);background:#f6f9ff}
a.doc>div{flex:1;min-width:0}a.doc b{display:block;font-size:13.5px;word-break:break-all}a.doc small{color:var(--muted);font-size:12px}
a.doc>.ico:first-child{color:var(--primary)}a.doc>.ico:last-child{color:var(--muted)}
.docs.old a.doc{opacity:.7}
.remark{background:#fffbea;border:1px solid #f1e3a3;border-radius:10px;padding:10px 12px;font-size:13px;color:#5b4a06;white-space:pre-wrap}
.remark-cell{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--ink-2)}
.filebox{margin-top:6px}
.filelist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.filelist li{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line-2);border-radius:10px;padding:6px 10px;font-size:13px}
.filelist .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist .iconbtn{padding:3px}.filelist .iconbtn .ico{width:14px;height:14px}
.filelist .ico{color:var(--muted)}

/* ---------- survey calendar (by date) ---------- */
.cal-day{position:relative;min-height:46px}
.cal-n{position:absolute;top:3px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;padding:0 4px}
.cal-day.approval{background:var(--primary-50);border-color:var(--primary-100)}
.cal-day.scheduled{background:var(--teal-50);border-color:#bfe3e6}
.cal-day.rejected{background:var(--red-50);border-color:#f3c2c2}
.cal-day.done{background:var(--green-50);border-color:#bfe6cd}
.cal-day.selected .cal-n{background:#fff;color:var(--primary)}
.cal-day.selected.approval,.cal-day.selected.scheduled,.cal-day.selected.rejected,.cal-day.selected.done{background:var(--primary);border-color:var(--primary)}
.dot.approval{background:var(--primary-50);border-color:var(--primary-100)}.dot.scheduled{background:var(--teal-50);border-color:#bfe3e6}
.dot.rejected{background:var(--red-50);border-color:#f3c2c2}.dot.done{background:var(--green-50);border-color:#bfe6cd}
.sched{align-items:start}
.daylist{display:grid;gap:12px}
.dayitem{border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:12px;padding:12px 14px;background:#fff}
.dayitem.scheduled{border-left-color:var(--teal)}.dayitem.rejected{border-left-color:var(--red)}.dayitem.done{border-left-color:var(--green)}
.di-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}.di-top>.pill{margin-left:auto}
.di-facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px}
.cf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}.cf .ico{width:14px;height:14px;color:var(--muted)}
.dayitem .contact{margin-top:8px}

/* ---------- reports ---------- */
.report-table td{vertical-align:top}
.report-table .reason{display:block;max-width:240px;white-space:normal;font-size:12.5px}

/* ---------- complete report ---------- */
.modal.wide{max-width:980px}
.report{padding-top:14px}
.rhead{display:flex;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:2px solid var(--navy)}
.rhead>.pill{margin-left:auto}
.rhead h1{font-size:1.5rem}.rorg{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.rsec{margin-top:18px;break-inside:avoid-page}
.rsec h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--primary);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
table.kv th{width:170px;background:none;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line-2);padding:7px 10px}
table.kv td{padding:7px 10px;font-size:13.5px}
table.grid-table th,table.grid-table td{padding:7px 10px;font-size:12.5px;border:1px solid var(--line);vertical-align:top}
table.grid-table th{background:#f1f5f9}.nowrap{white-space:nowrap}
.rsec .surveyor-card{margin-top:0}

@media print{
  body{background:#fff}
  .toasts{display:none!important}
  .overlay{position:static;background:none;backdrop-filter:none;padding:0;display:block;animation:none}
  .modal,.modal.wide{box-shadow:none;max-width:none;max-height:none;overflow:visible;border-radius:0}
  .modal-h,.noprint{display:none!important}
  .modal-b{padding:0}
  a.doc{border:1px solid #bbb}
  .step.now .dot,.step.stop .dot{box-shadow:none}
}
@media (max-width:700px){.contact{flex-wrap:wrap}.cbtns{margin-left:44px}.surveyor-card{flex-wrap:wrap}}

/* =====================================================================
   Light glass theme: white and blue, frosted panels over a soft blue sky.
   (Loaded last, so it re-skins everything above without touching the layout rules.)
   ===================================================================== */
:root{
  --primary:#2563eb;--primary-600:#1d4ed8;--primary-50:#eaf2ff;--primary-100:#d3e3ff;
  --bg:#f1f6ff;--navy:#123a8a;--navy-2:#1d4ed8;--navy-3:#3b82f6;
  --ink:#0f2347;--ink-2:#334866;--muted:#6b7f9e;
  --line:rgba(120,150,200,.28);--line-2:rgba(120,150,200,.16);
  --glass:rgba(255,255,255,.60);--glass-hi:rgba(255,255,255,.82);--glass-edge:rgba(255,255,255,.95);
  --glass-shadow:0 10px 34px rgba(37,99,235,.10),0 1px 0 rgba(255,255,255,.9) inset;
  --radius:20px;--shadow:0 10px 34px rgba(37,99,235,.10);--shadow-lg:0 30px 70px rgba(30,64,140,.28);
}
body{background:#f3f7ff;color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 600px at 6% -8%,#bfd6ff 0,transparent 62%),
  radial-gradient(800px 560px at 102% 8%,#d4e5ff 0,transparent 58%),
  radial-gradient(900px 700px at 55% 112%,#bcd4ff 0,transparent 62%)}

/* frosted surfaces */
.card,.kpi,.howto .s,.preq,.auth-card,.cal,.offer,.topbar,.usercard,.sidebar{
  -webkit-backdrop-filter:blur(20px) saturate(165%);backdrop-filter:blur(20px) saturate(165%)}
.card,.kpi,.howto .s,.preq,.auth-card{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);border-radius:var(--radius)}
.card .card,.card .cal,.card .offer,.cal{background:rgba(255,255,255,.55);box-shadow:none;border:1px solid var(--line-2)}
.fact,.contact,a.doc,.filelist li,.booklist li,.timeline .say,.dayitem{background:rgba(255,255,255,.6);border-color:var(--line-2)}
.contact.now{background:rgba(254,243,226,.8)}

/* floating glass sidebar and top bar */
.layout{grid-template-columns:276px minmax(0,1fr);gap:18px;padding:16px;background:none}
.sidebar{position:sticky;top:16px;height:calc(100vh - 32px);border-radius:26px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);color:var(--ink-2);padding:20px 14px 14px;overflow:auto}
.brandmark{border-bottom:1px solid var(--line)}
.brandmark b{color:var(--ink)}.brandmark span{color:var(--muted)}
.logo{background:linear-gradient(135deg,#60a5fa,#1d4ed8);box-shadow:0 10px 22px rgba(37,99,235,.38)}
.navlabel{color:#7f93b4}
.nav button{color:var(--ink-2);border-radius:14px;font-weight:550}
.nav button:hover{background:rgba(37,99,235,.09);color:var(--primary)}
.nav button.on{background:linear-gradient(135deg,#4f8ff7,#2563eb);color:#fff;box-shadow:0 10px 22px rgba(37,99,235,.35)}
.nav button.on .ico{color:#fff}
.nav .count{background:var(--primary);color:#fff}.nav button.on .count{background:#fff;color:var(--primary)}
.nav-parent .chev{margin-left:auto;display:inline-flex;transition:transform .2s}.nav-parent .chev.open{transform:rotate(180deg)}
.nav-parent .chev .ico{width:16px;height:16px}
.nav-parent.on-parent{color:var(--primary);background:rgba(37,99,235,.08)}
.subnav{display:flex;flex-direction:column;gap:3px;margin:2px 0 4px 18px;padding-left:10px;border-left:2px solid var(--primary-100)}
.subnav button{padding:8px 10px;font-size:13px}
.usercard{background:rgba(255,255,255,.65);border:1px solid var(--glass-edge)}
.usercard .who b{color:var(--ink)}.usercard .who span{color:var(--muted)}
.usercard .iconbtn{color:var(--ink-2);border-color:var(--line);background:rgba(255,255,255,.7)}
.usercard .iconbtn:hover{background:var(--primary-50);color:var(--primary)}
.avatar{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.topbar{position:sticky;top:16px;margin:0 0 4px;padding:14px 22px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.chip{background:rgba(255,255,255,.7);border-color:var(--line)}
.chip.poc{background:var(--primary-50);color:var(--primary);border-color:var(--primary-100)}
main{padding:18px 2px 48px;max-width:none}

/* buttons and fields */
button,.btn{background:linear-gradient(135deg,#4f8ff7,#2563eb);border-color:#2563eb;border-radius:12px;box-shadow:0 6px 16px rgba(37,99,235,.28)}
button:hover{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
button.secondary,.iconbtn,.btn-ghost{background:rgba(255,255,255,.72);color:var(--ink-2);border-color:var(--line);box-shadow:none}
button.secondary:hover,.iconbtn:hover,.btn-ghost:hover{background:var(--primary-50);color:var(--primary)}
button.danger{background:rgba(255,255,255,.75);box-shadow:none}
button.danger.solid{background:var(--red);box-shadow:0 6px 16px rgba(198,40,40,.25)}
button.green{background:linear-gradient(135deg,#22a55a,#15803d);border-color:#15803d;box-shadow:0 6px 16px rgba(21,128,61,.25)}
.chips button{background:rgba(255,255,255,.7);box-shadow:none}
input,select,textarea{background:rgba(255,255,255,.78);border:1px solid rgba(120,150,200,.4);border-radius:12px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:#fff}

/* tables */
th{background:rgba(234,242,255,.65);color:#5b7096}
tr.row:hover{background:rgba(37,99,235,.06)}
tr.row.sel{background:rgba(37,99,235,.11)}
td,th{border-bottom-color:var(--line-2)}

/* tiles, banners */
.kpi{transition:transform .15s,box-shadow .15s}.kpi:hover{transform:translateY(-2px)}
.focus{background:linear-gradient(120deg,rgba(59,130,246,.92),rgba(37,99,235,.92) 55%,rgba(96,165,250,.9));border:1px solid rgba(255,255,255,.5);border-radius:var(--radius);box-shadow:0 14px 34px rgba(37,99,235,.28)}
.notice{background:rgba(254,243,226,.75)}.notice.red{background:rgba(253,236,236,.8)}.notice.blue{background:rgba(234,242,255,.8)}
.remark{background:rgba(255,251,234,.85)}
.surveyor-card{background:rgba(226,244,245,.75)}

/* calendar: rounded tiles on glass */
.cal{border-radius:20px;padding:16px}
.cal-grid{gap:7px}
.cal-day{background:rgba(255,255,255,.78);border:1px solid var(--line-2);border-radius:14px;min-height:50px;font-weight:600;color:var(--ink-2);transition:transform .12s,background .12s,box-shadow .12s}
.cal-day:hover:not(:disabled){background:var(--primary-50);transform:translateY(-1px);box-shadow:0 6px 14px rgba(37,99,235,.15)}
.cal-day.today{box-shadow:inset 0 0 0 2px #7fb0ff;color:var(--primary)}
.cal-day.selected,.cal-day.selected:hover{background:linear-gradient(135deg,#4f8ff7,#2563eb);color:#fff;box-shadow:0 10px 20px rgba(37,99,235,.38)}
.cal-day.approval{background:#e4eeff;border-color:#c5dbff;color:#1d4ed8}
.cal-day.scheduled{background:#dcf3f6;border-color:#b4e0e5;color:#0e7c86}
.cal-day.rejected{background:#fde8e8;border-color:#f6c4c4;color:#c62828}
.cal-day.done{background:#e0f5e8;border-color:#b7e3c6;color:#15803d}
.cal-day.selected.approval,.cal-day.selected.scheduled,.cal-day.selected.rejected,.cal-day.selected.done{background:linear-gradient(135deg,#4f8ff7,#2563eb);color:#fff}
.cal-n{background:var(--primary);box-shadow:0 2px 6px rgba(37,99,235,.4)}
.cal-section{margin-bottom:20px}
.cal-section .grid{margin:0}
.dayitem{border-radius:16px;border-left-width:4px}

/* modals */
.overlay{background:rgba(30,60,130,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid #fff;border-radius:26px}
.modal-h{border-bottom-color:var(--line)}
.rhead{border-bottom-color:var(--primary)}

/* sign-in pages and portal */
.auth{background:none}
.auth-hero{background:radial-gradient(900px 480px at -10% -10%,rgba(255,255,255,.35) 0,transparent 60%),linear-gradient(155deg,#2f6df0 0%,#1d4ed8 55%,#4f8ff7 100%);margin:16px 0 16px 16px;border-radius:30px;box-shadow:0 24px 60px rgba(37,99,235,.30)}
.auth-form{background:none}
.auth-card{background:rgba(255,255,255,.7)}
.ptop{background:linear-gradient(90deg,#2563eb,#4f8ff7);color:#eaf2ff}
.phero{background:linear-gradient(135deg,#2f6df0 0%,#4f8ff7 100%)}
.howto .n{background:var(--primary-50)}

/* small screens */
@media (max-width:1000px){
  .layout{padding:10px;grid-template-columns:1fr;background:none}
  .sidebar{position:static;height:auto;border-radius:20px;overflow:visible}
  .subnav{flex-direction:row;flex-wrap:wrap;margin:0;padding:0;border:0}
  .topbar{position:static}
  .auth-hero{margin:10px;border-radius:24px}
}

.cols2.dash{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
td .pill{white-space:normal;line-height:1.3}
td:first-child{min-width:170px}
.remark-cell{max-width:120px}

/* ---- Requests first, no blank column, compact contacts ---- */
.focus.slim{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;margin:0 0 14px;font-size:13px}
.focus.slim b{font-weight:600}.focus.slim span{opacity:.85}.focus.slim svg{width:16px;height:16px}
.cols2.dash{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);margin-bottom:18px}
.cols2.dash>.card:first-child{max-height:calc(100vh - 150px);overflow:auto}
#detail{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto;border-radius:18px;align-self:start}
#detail>.card{margin:0}
#detail .contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#detail .contact{padding:8px;gap:8px;min-width:0}
#detail .contact .cinfo{min-width:0}
#detail .contact .cinfo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

<script>/* Small month-calendar widget shared by the CMS and the portal.
   Dates are plain YYYY-MM-DD strings (IST). No innerHTML: everything is built with DOM calls. */
(function () {
  'use strict';
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const istToday = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  /* opts: { year, month (0-11), selected, minDate, marked: {date: 'booked'|'full'|'approval'|...}, counts: {date: n}, legend: [..], onSelect(date), onMonth(year, month) } */
  function calendar(opts) {
    const root = document.createElement('div');
    root.className = 'cal';
    const head = document.createElement('div');
    head.className = 'cal-head';
    const prev = document.createElement('button'); prev.type = 'button'; prev.textContent = '‹'; prev.className = 'btn-ghost'; prev.setAttribute('aria-label', 'Previous month');
    const next = document.createElement('button'); next.type = 'button'; next.textContent = '›'; next.className = 'btn-ghost'; next.setAttribute('aria-label', 'Next month');
    const title = document.createElement('strong'); title.textContent = `${MONTHS[opts.month]} ${opts.year}`;
    const go = (delta) => { const d = new Date(Date.UTC(opts.year, opts.month + delta, 1)); opts.onMonth && opts.onMonth(d.getUTCFullYear(), d.getUTCMonth()); };
    prev.addEventListener('click', () => go(-1)); next.addEventListener('click', () => go(1));
    head.append(prev, title, next);
    root.append(head);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach((d) => { const c = document.createElement('div'); c.className = 'cal-dow'; c.textContent = d; grid.append(c); });
    const first = new Date(Date.UTC(opts.year, opts.month, 1));
    const lead = (first.getUTCDay() + 6) % 7; // Monday-first
    for (let i = 0; i < lead; i++) grid.append(document.createElement('div'));
    const days = new Date(Date.UTC(opts.year, opts.month + 1, 0)).getUTCDate();
    const today = istToday();
    for (let d = 1; d <= days; d++) {
      const date = iso(opts.year, opts.month, d);
      const mark = opts.marked && opts.marked[date];
      const disabled = (opts.minDate && date < opts.minDate) || mark === 'full';
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.append(document.createTextNode(String(d)));
      const n = opts.counts && opts.counts[date];
      if (n) { const b = document.createElement('span'); b.className = 'cal-n'; b.textContent = String(n); cell.append(b); }
      cell.className = 'cal-day' + (mark ? ' ' + mark : '') + (date === opts.selected ? ' selected' : '') + (date === today ? ' today' : '');
      cell.disabled = !!disabled && !!opts.onSelect;
      if (mark === 'full') cell.title = 'No surveyor is free on this date';
      if (mark === 'booked') cell.title = 'Booked';
      if (opts.onSelect && !cell.disabled) cell.addEventListener('click', () => opts.onSelect(date));
      grid.append(cell);
    }
    root.append(grid);
    if (opts.legend) {
      const lg = document.createElement('div'); lg.className = 'cal-legend';
      opts.legend.forEach(([cls, text]) => { const s = document.createElement('span'); const dot = document.createElement('i'); dot.className = 'dot ' + cls; s.append(dot, ' ' + text); lg.append(s); });
      root.append(lg);
    }
    return root;
  }
  window.SurveyCal = { calendar, istToday, MONTHS };
})();
</script>
<script>/* In-browser backend for the single-file build. A direct port of lib/*.js and server.js (same rules, same JSON shapes),
   running on plain in-memory arrays instead of SQLite. Nothing leaves the page; reloading resets the demo. */
(function (root) {
  'use strict';
  class HttpError extends Error { constructor(status, message) { super(message); this.status = status; } }

  /* ---------- helpers (lib/security.js) ---------- */
  const todayISO = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
  const isoDate = (s) => { if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; const d = new Date(s + 'T00:00:00Z'); return !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === s; };
  const isFutureDate = (s) => isoDate(s) && s > todayISO();
  const addDaysISO = (iso, n) => new Date(new Date(iso + 'T00:00:00Z').getTime() + n * 86400e3).toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400e3);
  const dispCode = (code, rev) => (rev > 0 ? `${code} (Revised${rev > 1 ? ' ' + rev : ''})` : code);
  const emailOk = (v) => typeof v === 'string' && v.length <= 120 && /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(v);
  const phoneOk = (v) => typeof v === 'string' && /^\+?[0-9][0-9 ]{6,16}$/.test(v);
  const str = (v, min, max, field = 'Value') => { if (typeof v !== 'string') throw new HttpError(400, `${field} is required.`); const t = v.trim(); if (t.length < min || t.length > max) throw new HttpError(400, `${field} must be ${min}-${max} characters.`); return t; };
  const int = (v, field = 'Value') => { const n = Number(v); if (!Number.isInteger(n) || n <= 0) throw new HttpError(400, `${field} is invalid.`); return n; };
  const passwordProblem = (pw) => (typeof pw !== 'string' || pw.length < 10 ? 'Password must be at least 10 characters.' : pw.length > 128 ? 'Password is too long.' : !/[a-z]/.test(pw) || !/[A-Z]/.test(pw) || !/\d/.test(pw) ? 'Password needs upper-case, lower-case and a digit.' : null);
  function hash(s) { // small non-cryptographic hash (the real server uses SHA-256); keeps the audit chain verifiable in the demo
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  }
  const OPTIONAL = (v, max, field) => (v === undefined || v === null || (typeof v === 'string' && !v.trim()) ? null : str(v, 1, max, field));

  /* ---------- state ---------- */
  let DB, SESS, cfg = { offerTtlMs: 120000, maxFails: 5, lockMs: 15 * 60e3 };
  const next = (t) => (DB[t].length ? DB[t][DB[t].length - 1].id + 1 : 1);
  const by = (t, id) => DB[t].find((r) => r.id === id);
  const subName = (id) => (by('substations', id) || {}).name;
  const userName = (id) => (id ? (by('users', id) || {}).name : null) || null;

  /* ---------- audit (lib/audit.js) ---------- */
  function audit(o) {

  const REQ_TABS = ['req_all', 'req_action', 'req_review', 'req_scheduled', 'req_completed', 'req_rejected'];
  const state = { user: null, tab: 'dashboard', selectedId: null, requests: [], notes: [], activity: [], navOpen: false, collapsed: false, reqOpen: true, noteCat: 'all', repTab: 'approved', cal: null, f: freshFilter() };
  const app = document.getElementById('app');

  function freshFilter() { return { q: '', zone: '', division: '', nodal_centre: '', substation: '', status: '', priority: '', from: '', to: '' }; }

  async function api(method, url, body) {
    const r = await fetch(url, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'poc-client' }, body: body ? JSON.stringify(body) : undefined });
    let data = {}; try { data = await r.json(); } catch { /* empty */ }
    if (r.status === 401 && !url.endsWith('/login')) { state.user = null; render(); throw new Error('Please sign in again.'); }
    if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
    return data;
  }
  const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, 'bad'); } };

  /* ---------- formatting ---------- */
  const IST = { timeZone: 'Asia/Kolkata' };
  const fmtTime = (ts) => (ts ? new Date(ts).toLocaleString('en-IN', { ...IST, day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }) : 'Not available');
  const fmtDate = (d, none = 'Not scheduled') => (d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' }) : none);
  const fmtLong = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { timeZone: 'UTC', day: 'numeric', month: 'long', year: 'numeric' });
  const fmtDay = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const fmtAgo = (ts) => {
    if (!ts) return 'Not available';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'Just now';
    if (m < 60) return `${m} min ago`;
    if (m < 1440) return `${Math.round(m / 60)} h ago`;
    return new Date(ts).toLocaleDateString('en-IN', { ...IST, day: 'numeric', month: 'short' });
  };
  const fmtSize = (n) => (n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1024 / 1024).toFixed(1)} MB`);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const na = (v, t = 'Not available') => (v === null || v === undefined || v === '' ? t : v);
  const daysUntil = (d) => Math.round((Date.parse(d + 'T00:00:00Z') - Date.parse(SurveyCal.istToday() + 'T00:00:00Z')) / 864e5);

  /* ---------- small building blocks ---------- */
  const PRI = { Low: 'plain', Medium: 'blue', High: 'amber', Critical: 'red' };
  const priBadge = (p) => h('span', { class: 'pill pri ' + (PRI[p] || 'blue') }, p || 'Medium');
  const stageColor = (r) => (r.group === 'completed' ? 'green' : r.group === 'rejected' ? 'red' : r.stage === 'CLOSED' ? '' : r.allowed_actions && r.allowed_actions.length ? 'amber' : r.group === 'scheduled' ? 'teal' : r.stage === 'PM_COMPLETION' ? 'violet' : 'blue');
  const stageBadge = (r) => h('span', { class: 'pill ' + stageColor(r) }, r.stage_label);
  const cardHead = (ic, title, sub, end) => h('div', { class: 'card-h' }, h('span', { class: 'ibox' }, icon(ic)), h('div', null, h('h2', null, title), sub ? h('div', { class: 'sub' }, sub) : null), end ? h('div', { class: 'end' }, end) : null);
  const empty = (ic, text, btn) => h('div', { class: 'empty' }, h('span', { class: 'ibox' }, icon(ic)), h('div', null, text), btn || null);
  const chipFact = (ic, text) => h('span', { class: 'cf' }, icon(ic), text);
  const slaText = (dl) => (dl.overdue ? `Overdue by ${plural(-dl.days_left, 'day')}` : dl.days_left === 0 ? 'Due today' : `${plural(dl.days_left, 'day')} left`);
  const slaChip = (r, long) => (r.deadline ? h('span', { class: 'sla ' + r.deadline.state, title: `Due ${fmtDate(r.deadline.due)} (allowed ${plural(r.deadline.max_days, 'day')} at this stage)` },
    icon('clock'), long ? `Due ${fmtDate(r.deadline.due)} · ${slaText(r.deadline)}` : slaText(r.deadline)) : null);
  const dateLabel = (r) => (r.group === 'completed' ? 'Surveyed' : r.group === 'scheduled' ? 'Scheduled for' : r.group === 'rejected' && !r.date_proposed ? 'Not scheduled' : 'Requested');
  const dateCell = (r) => (r.group === 'rejected' && !r.date_proposed ? h('span', { class: 'muted' }, 'Not scheduled')
    : h('div', null, h('span', { class: 'datecell' }, icon('calendar'), fmtDate(r.survey_date)), h('div', { class: 'cell-sub' }, dateLabel(r))));
  const ownerText = (r) => na(r.owner_label, r.group === 'completed' ? 'None (completed)' : r.stage === 'CLOSED' ? 'None (closed)' : 'Not assigned');

  /* ---------- mail and phone buttons ---------- */
  // Links are built only from values that pass these checks, then prefixed with mailto: / tel:, so nothing else can ever become a link target.
  const safeMail = (e) => /^[^\s@<>"']+@[^\s@<>"']+$/.test(e || '');
  const safeTel = (p) => /^\+?[0-9][0-9 ]{6,16}$/.test(p || '');
  function contactBtns(p, compact) {
    return h('span', { class: 'cbtns' },
      safeMail(p.email) ? h('a', { class: 'cbtn', href: 'mailto:' + p.email, title: `Email ${p.name} (${p.email})`, 'aria-label': `Email ${p.name}` }, icon('mail'), compact ? null : 'Mail') : null,
      safeTel(p.phone) ? h('a', { class: 'cbtn', href: 'tel:' + p.phone.replace(/[^+\d]/g, ''), title: `Call ${p.name} (${p.phone})`, 'aria-label': `Call ${p.name}` }, icon('phone'), compact ? null : 'Call') : null);
  }
  const personRow = (p, tag) => h('div', { class: 'contact' + (tag === 'Current owner' ? ' now' : '') }, avatar(p.name),
    h('div', { class: 'cinfo' }, tag ? h('small', null, tag) : null, h('b', null, p.name), h('span', null, [p.title || ROLE[p.role] || p.role, p.scope].filter(Boolean).join(' · ')), h('span', null, na(p.phone, 'No phone on file'))),
    contactBtns(p, true));

  /* ---------- navigation (hash based, so Back works and links can be shared) ---------- */
  function navFor(role) {
    if (role === 'ADMIN') return [['users'], ['audit'], ['notes']];
    if (role === 'SURVEYOR') return [['dashboard', 'My surveys'], ['offers'], ['mycal'], ['notes']];
    const n = [['dashboard'], ['requests'], role === 'COORD' ? ['new', 'New Request'] : null, ['calendar'], ['reports'], ['notes']].filter(Boolean);
    return n;
  }
  const reqChildren = () => REQ_TABS.filter((k) => !(k === 'req_action' && state.user.role === 'SEIT'));
  const allowedTabs = () => navFor(state.user.role).flatMap(([k]) => (k === 'requests' ? [...reqChildren(), 'detail'] : [k, ...(k === 'dashboard' ? ['detail'] : [])]));
  function parseHash() {
    const m = (location.hash || '').replace(/^#\/?/, '').split('/');
    if (m[0] === 'request' && Number(m[1])) { state.tab = 'detail'; state.selectedId = Number(m[1]); } else { state.tab = m[0] || 'dashboard'; state.selectedId = null; }
    if (state.user && !allowedTabs().includes(state.tab)) state.tab = navFor(state.user.role)[0][0];
  }
  function go(tab, id) {
    if (tab !== state.tab || tab === 'detail') state.f = freshFilter();
    state.tab = tab; state.selectedId = id || null; state.navOpen = false;
    const hash = tab === 'detail' ? `#/request/${id}` : `#/${tab}`;
    if (location.hash !== hash) history.pushState(null, '', hash);
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener('popstate', () => { if (state.user && !location.hash.startsWith('#/portal')) { parseHash(); render(); } });

  /* ---------- modal + date picker + file picker ---------- */
  function modal(title, body, { reject = false, ic = 'file', wide = false } = {}) {
    const close = () => { ov.remove(); document.removeEventListener('keydown', esc); };
    const esc = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    const ov = h('div', { class: 'overlay', onclick: (e) => { if (e.target === ov) close(); } },
      h('div', { class: 'modal' + (reject ? ' reject' : '') + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
        h('div', { class: 'modal-h' }, h('span', { class: 'ibox' }, icon(reject ? 'alert' : ic)), h('h2', null, title),
          h('button', { class: 'iconbtn x', 'aria-label': 'Close', onclick: close }, icon('x'))),
        h('div', { class: 'modal-b' }, body)));
    document.body.append(ov);
    return close;
  }
  const selChip = (text) => h('div', { class: 'selchip' }, icon('calendar'), h('span', null, text));
  // Calendar that marks days when NO surveyor is free (fetched from the server).
  function picker({ initial, onChange }) {
    const today = SurveyCal.istToday();
    let sel = initial && initial > today ? initial : null;
    const seed = sel || today;
    let y = Number(seed.slice(0, 4)), m = Number(seed.slice(5, 7)) - 1;
    const box = h('div');
    const draw = guard(async () => {
      const av = await api('GET', `/api/availability?month=${y}-${String(m + 1).padStart(2, '0')}`);
      const marked = {}; av.fully_booked.forEach((d) => { marked[d] = 'full'; });
      box.replaceChildren(SurveyCal.calendar({
        year: y, month: m, selected: sel, minDate: today, marked,
        legend: [['full', 'No surveyor free'], ['selected', 'Chosen date']],
        onSelect: (d) => { sel = d; onChange(d); draw(); }, onMonth: (ny, nm) => { y = ny; m = nm; draw(); },
      }));
    });
    draw();
    return box;
  }
  // File picker: up to 4 files, 2 MB each (the server checks again, including the real file type).
  function fileBox({ label = 'Attach files', max = 4 } = {}) {
    const picked = [];
    const list = h('ul', { class: 'filelist' });
    const input = h('input', { type: 'file', multiple: true, accept: '.pdf,.png,.jpg,.jpeg,.docx,.xlsx', style: 'display:none', 'aria-label': label });
    const draw = () => list.replaceChildren(...picked.map((f, i) => h('li', null, icon('file'), h('span', { class: 'fname' }, f.name), h('span', { class: 'muted small' }, fmtSize(f.size)),
      h('button', { type: 'button', class: 'iconbtn', 'aria-label': `Remove ${f.name}`, onclick: () => { picked.splice(i, 1); draw(); } }, icon('x')))));
    input.addEventListener('change', () => {
      for (const f of input.files) {
        if (picked.length >= max) { toast(`Up to ${max} files at a time.`, 'bad'); break; }
        if (f.size > 2 * 1024 * 1024) { toast(`${f.name} is larger than 2 MB.`, 'bad'); continue; }
        picked.push(f);
      }
      input.value = ''; draw();
    });
    const read = (f) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res({ name: f.name, data: String(r.result).split(',')[1] || '' });
      r.onerror = () => rej(new Error(`Could not read ${f.name}.`));
      r.readAsDataURL(f);
    });
    return {
      el: h('div', { class: 'filebox' }, h('button', { type: 'button', class: 'secondary', onclick: () => input.click() }, icon('paperclip'), label), input,
        h('div', { class: 'hint' }, 'PDF, PNG, JPG, DOCX or XLSX · up to 4 files · 2 MB each'), list),
      count: () => picked.length, files: () => Promise.all(picked.map(read)),
    };
  }

  /* ---------- actions on a request: every one opens a confirmation dialog ---------- */
  const LABEL = { upload_documents: 'Upload Documents', approve_lc: 'Approve Request', start_review: 'Receive & Send to Review', backtrack: 'Backtrack to AE', reject: 'Reject Request', reschedule: 'Reschedule Survey',
    accept_intake: 'Accept Public Request', decline_intake: 'Decline Request', resubmit: 'Submit Revised Request', assign: 'Assign Surveyor', submit_report: 'Submit Report', return_report: 'Return for Correction', complete: 'Approve Report' };
  const ICON = { approve: 'fwd', approve_lc: 'check', start_review: 'eye', backtrack: 'undo', upload_documents: 'upload', reject: 'x', reschedule: 'calendar', accept_intake: 'check', decline_intake: 'x', resubmit: 'send', assign: 'user', submit_report: 'file', return_report: 'undo', complete: 'check' };
  const DANGER = ['reject', 'decline_intake'];
  const actionLabel = (a, r) => {
    if (a === 'approve') return r.stage === 'CHIEF_MONITOR' ? 'Verify & Send to Surveyor' : `Approve & Forward to ${r.forward_to}`;
    if (a === 'submit_report' && r.return_note) return 'Resubmit Report';
    return LABEL[a];
  };
  const aeDocs = (d) => d.documents.filter((x) => x.kind === 'AE_DOCS' && x.current);

  // A comment box with a clear "required" / "optional" label.
  function commentBox({ required, label = 'Comment', placeholder = '', min = 5, rows = 3 }) {
    const ta = h('textarea', { rows, maxlength: 500, 'aria-label': label, placeholder });
    return {
      el: [h('label', null, label, ' ', h('span', required ? { class: 'req' } : { class: 'opt' }, required ? '(required)' : '(optional)')), ta],
      value: () => ta.value.trim(),
      check: () => (required && ta.value.trim().length < min ? `${label} is required (at least ${min} characters).` : null),
    };
  }
  /* The one confirmation dialog. submit() returns { error } to stay open, or { toast } after calling the API. */
  function confirmDialog({ req, title, ic, danger, notice, blocks = [], label, cls, submit }) {
    const err = h('div', { class: 'err', role: 'alert' });
    let busy = false;
    const btn = h('button', { class: cls || (danger ? 'danger solid' : ''), onclick: async () => {
      if (busy) return;
      err.textContent = ''; busy = true; btn.disabled = true;
      try {
        const out = await submit();
        if (out && out.error) err.textContent = out.error;
        else { close(); toast((out && out.toast) || 'Done.'); await reloadAll(); }
      } catch (e) { err.textContent = e.message; }
      busy = false; btn.disabled = false;
    } }, icon(ic || 'check'), label);
    const close = modal(title, h('div', null,
      req ? h('div', { class: 'dlg-ctx' }, h('b', null, req.display_code), ' · ', req.title, h('div', { class: 'cell-sub' }, `${req.substation} · ${req.stage_label}`)) : null,
      notice ? h('div', { class: 'notice ' + (notice.tone || 'blue') }, icon(notice.icon || 'alert'), h('span', null, notice.text)) : null,
      blocks, err,
      h('div', { class: 'actions' }, btn, h('button', { class: 'secondary', onclick: () => close() }, 'Cancel'))), { reject: !!danger, ic });
    return close;
  }
  const post = (req, action, body) => api('POST', `/api/requests/${req.id}/${action}`, body);

  const actions = {
    approve: (req, d) => {
      const isAE = req.stage === 'AE_SUBSTATION', chief = req.stage === 'CHIEF_MONITOR';
      const cm = commentBox({ required: false, placeholder: chief ? 'Optional note' : `Optional note for the ${req.forward_to}` });
      const files = isAE ? fileBox({ label: 'Add documents' }) : null;
      const have = isAE ? aeDocs(d).length : 0;
      confirmDialog({ req, title: actionLabel('approve', req), ic: chief ? 'check' : 'fwd', cls: chief ? 'green' : '', label: actionLabel('approve', req),
        notice: chief ? { icon: 'pin', text: 'After this, the nearest free surveyor is offered the job. SEIT can see every step but approves nothing.' }
          : isAE ? { icon: 'paperclip', tone: have ? 'blue' : 'amber', text: have ? `${plural(have, 'document')} already saved. You can add more before forwarding.` : 'Attach the substation documents. At least one is needed before this can go to the AEE.' }
            : { icon: 'fwd', text: `This sends the request to ${req.next_label || req.forward_to}.` },
        blocks: [isAE ? files.el : null, cm.el],
        submit: async () => {
          if (isAE && !have && !files.count()) return { error: 'Please attach at least one document.' };
          const body = { remarks: cm.value() || undefined };
          if (isAE) body.files = await files.files();
          await post(req, 'approve', body);
          return { toast: chief ? 'Approved. A nearby surveyor is being offered the job.' : `Forwarded to ${req.forward_to}.` };
        } });
    },
    upload_documents: (req, d) => {
      const files = fileBox({ label: 'Choose documents' });
      const have = aeDocs(d);
      confirmDialog({ req, title: 'Upload Documents', ic: 'upload', label: 'Save documents',
        notice: { icon: 'clock', text: `Save documents as you prepare them. Nobody else sees them until you forward to the AEE. Due ${fmtDate(req.deadline && req.deadline.due, 'soon')}.` },
        blocks: [have.length ? h('ul', { class: 'filelist' }, have.map((x) => h('li', null, icon('file'), h('span', { class: 'fname' }, x.name), h('span', { class: 'muted small' }, fmtSize(x.size))))) : null, files.el],
        submit: async () => { if (!files.count()) return { error: 'Please choose at least one file.' }; await post(req, 'upload_documents', { files: await files.files() }); return { toast: 'Documents saved.' }; } });
    },
    approve_lc: (req) => {
      const cm = commentBox({ required: false, placeholder: 'Optional note' });
      confirmDialog({ req, title: 'Approve Request', ic: 'check', label: 'Approve Request',
        notice: { tone: 'amber', text: 'Once you approve, the request can no longer be rejected or rescheduled. You then prepare the substation documents (4 days) and forward them to the AEE.' },
        blocks: [cm.el], submit: async () => { await post(req, 'approve_lc', { remarks: cm.value() || undefined }); return { toast: 'Request approved. Now prepare the documents.' }; } });
    },
    start_review: (req) => {
      const cm = commentBox({ required: false, placeholder: 'Optional note' });
      confirmDialog({ req, title: 'Receive & Send to Review', ic: 'eye', label: 'Receive & Send to Review',
        notice: { text: 'You confirm the request has reached you. You then review it and verify it for the survey.' },
        blocks: [cm.el], submit: async () => { await post(req, 'start_review', { remarks: cm.value() || undefined }); return { toast: 'Received and sent to review.' }; } });
    },
    backtrack: (req) => {
      const cm = commentBox({ required: true, label: 'What must the AE correct?' });
      confirmDialog({ req, title: 'Backtrack to AE', ic: 'undo', label: 'Send back to AE',
        notice: { text: req.stage === 'EE_REVISIT' ? 'It goes straight to the AE, skipping the AEE. The AEE is notified. The AE has 4 days to correct and forward it again.' : 'It goes back to the AE, who has 4 days to correct and forward it again. The EE is notified.' },
        blocks: [cm.el], submit: async () => { const e = cm.check(); if (e) return { error: e }; await post(req, 'backtrack', { reason: cm.value() }); return { toast: 'Sent back to the AE.' }; } });
    },
    reject: (req) => {

        blocks: [cm.el], submit: async () => { const e = cm.check(); if (e) return { error: e }; await post(req, 'reject', { reason: cm.value() }); return { toast: 'Rejected. The chain has been notified.' }; } });
    },
    reschedule: (req) => {
      let date = null;
      const cm = commentBox({ required: true, label: 'Reason for rescheduling', placeholder: 'e.g. Line shutdown not possible that week' });
      const chosen = selChip(`Current date: ${fmtDate(req.survey_date)}. No new date chosen yet.`);
      confirmDialog({ req, title: 'Reschedule Survey', ic: 'calendar', label: 'Reschedule Survey',
        notice: { text: 'The request stays at its current stage. Only the survey date changes, and everyone in the chain is told.' },
        blocks: [h('label', null, 'New survey date ', h('span', { class: 'req' }, '(required)')), picker({ onChange: (x) => { date = x; chosen.lastChild.textContent = `New date: ${fmtDate(x)} (was ${fmtDate(req.survey_date)})`; } }), chosen, cm.el],
        submit: async () => { if (!date) return { error: 'Please pick the new survey date.' }; const e = cm.check(); if (e) return { error: e }; await post(req, 'reschedule', { reason: cm.value(), new_date: date }); return { toast: `Survey moved to ${fmtDate(date)}.` }; } });

    accept_intake: (req) => {

        blocks: [cm.el], submit: async () => { await post(req, 'accept_intake', { remarks: cm.value() || undefined }); return { toast: 'Accepted. The approval chain starts.' }; } });
    },
    decline_intake: (req) => {

        submit: async () => { const e = cm.check(); if (e) return { error: e }; await post(req, 'decline_intake', { reason: cm.value() }); return { toast: 'Request declined.' }; } });
    },
    resubmit: (req) => {
      let date = req.date_proposed ? req.survey_date : null;
      const chosen = selChip(date ? `Date: ${fmtDate(date)}` : 'No date chosen yet');
      const cm = commentBox({ required: false, label: 'What changed in the revised request?' });
      const files = fileBox({ label: 'Attach supporting documents' });
      confirmDialog({ req, title: 'Submit Revised Request', ic: 'send', label: 'Submit Revised Request',
        notice: { tone: 'red', text: `Rejected at "${req.rejected_stage}" by ${req.rejected_by}: ${String(req.rejection_reason || '').replace(/[.\s]+$/, '')}.` },
        blocks: [h('label', null, 'Survey date ', h('span', { class: 'req' }, '(required)')), picker({ initial: date, onChange: (x) => { date = x; chosen.lastChild.textContent = `Date: ${fmtDate(x)}`; } }), chosen, cm.el,
          h('label', null, 'Supporting documents ', h('span', { class: 'req' }, '(required)')), files.el],
        submit: async () => {
          if (!date) return { error: 'Please choose a date.' };
          if (!files.count()) return { error: 'Please attach the supporting documents.' };
          await post(req, 'resubmit', { survey_date: date, remarks: cm.value() || undefined, files: await files.files() });

    assign: guard(async (req) => {
      const { surveyors } = await api('GET', `/api/surveyors?date=${req.survey_date}`);
      const sel = h('select', { 'aria-label': 'Surveyor' }, surveyors.map((s) => h('option', { value: s.id, disabled: !s.free }, `${s.name}${s.free ? '' : ' - already booked that day'}${s.online ? '' : ' (offline)'}`)));
      const cm = commentBox({ required: false });
      confirmDialog({ req, title: 'Assign Surveyor', ic: 'user', label: 'Assign Surveyor', notice: { text: `Survey date ${fmtDate(req.survey_date)}. Use this when no nearby surveyor accepted.` },
        blocks: [h('label', null, 'Surveyor'), sel, cm.el], submit: async () => { await post(req, 'assign', { surveyor_id: Number(sel.value), remarks: cm.value() || undefined }); return { toast: 'Surveyor assigned.' }; } });
    }),
    submit_report: (req) => {

  const brand = () => h('div', { class: 'brandmark' }, h('span', { class: 'logo' }, icon('zap')), h('div', null, h('b', null, 'Substation Survey'), h('span', null, 'Public request portal')));

  function authView() {
    const login = state.mode === 'login';
    const f = { name: h('input', { 'aria-label': 'Full name', autocomplete: 'name' }), email: h('input', { type: 'email', 'aria-label': 'Email', autocomplete: 'email', placeholder: 'you@example.com' }), pw: h('input', { type: 'password', 'aria-label': 'Password', autocomplete: login ? 'current-password' : 'new-password' }) };
    const err = h('div', { class: 'err', role: 'alert' });
    const go = async () => {
      try {
        if (!login) { await api('POST', '/portal/api/register', { name: f.name.value, email: f.email.value, password: f.pw.value }); toast('Account created.'); }
        await api('POST', '/portal/api/login', { email: f.email.value, password: f.pw.value }); await start();
      } catch (e) { err.textContent = e.message; }
    };
    f.pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    const feature = (ic, t, s) => h('div', { class: 'feature' }, h('span', { class: 'ibox' }, icon(ic)), h('div', null, h('b', null, t), h('span', null, s)));
    return h('div', { class: 'auth' },
      h('section', { class: 'auth-hero' }, brand(),
        h('h1', null, 'Request a substation survey online'),
        h('p', { class: 'lead' }, 'Create an account, choose the substation and a preferred date, and follow your request until the survey is done.'),
        h('div', { class: 'features' },
          feature('send', 'Send a request in minutes', 'No office visit or paperwork.'),
          feature('activity', 'Track every step', 'See when it is reviewed, approved and scheduled.'),
          feature('lock', 'Your data stays private', 'You only ever see your own requests.')),
        pylon()),
      h('section', { class: 'auth-form' }, h('div', { class: 'auth-card' },
        h('h2', null, login ? 'Sign in' : 'Create your account'), h('p', { class: 'muted' }, login ? 'Welcome back.' : 'It takes less than a minute.'),
        login ? null : [h('label', null, 'Full name'), f.name], h('label', null, 'Email'), f.email,
        h('label', null, 'Password'), f.pw, login ? null : h('div', { class: 'hint' }, 'At least 10 characters, with upper case, lower case and a digit.'), err,
        h('button', { class: 'wide', onclick: go }, login ? 'Sign in' : 'Create account', icon('arrow')),
        h('div', { class: 'demo' }, h('button', { class: 'secondary', style: 'width:100%', onclick: () => { state.mode = login ? 'register' : 'login'; render(); } }, login ? 'New here? Create an account' : 'I already have an account'),
          h('p', { class: 'small muted' }, 'This portal only sends your request in and shows its status. You never sign in to the KPTCL system.')))));
  }

  function homeView() {
    let date = null;
    const subs = h('select', { 'aria-label': 'Substation' });
    api('GET', '/portal/api/substations').then((d) => d.substations.forEach((s) => subs.append(h('option', { value: s.id }, s.name))));
    const title = h('input', { maxlength: 120, 'aria-label': 'What do you need surveyed?', placeholder: 'e.g. Survey near my plot boundary' });
    const chosen = h('div', { class: 'selchip' }, icon('calendar'), h('span', null, 'No date chosen'));
    const today = SurveyCal.istToday();
    let y = Number(today.slice(0, 4)), m = Number(today.slice(5, 7)) - 1;
    const calBox = h('div');
    const drawCal = () => calBox.replaceChildren(SurveyCal.calendar({ year: y, month: m, selected: date, minDate: today, legend: [['selected', 'Preferred date']],
      onSelect: (d) => { date = d; chosen.lastChild.textContent = `Preferred date: ${fmtDate(d)}`; drawCal(); }, onMonth: (ny, nm) => { y = ny; m = nm; drawCal(); } }));
    drawCal();
    const how = (n, t, s) => h('div', { class: 's' }, h('span', { class: 'n' }, n), h('div', null, h('b', null, t), h('span', null, s)));
    const cardHead = (ic, t, s) => h('div', { class: 'card-h' }, h('span', { class: 'ibox' }, icon(ic)), h('div', null, h('h2', null, t), s ? h('div', { class: 'sub' }, s) : null));
    return h('div', null,
      h('section', { class: 'phero' }, h('div', { class: 'inner' }, h('h1', null, `Hello, ${state.user.name.split(' ')[0]}`), h('p', null, 'Send a new survey request or check how your earlier requests are moving.')), pylon()),
      h('div', { class: 'pmain' },
        h('div', { class: 'howto' }, how(1, 'Send request', 'Pick substation and date'), how(2, 'Review', 'KPTCL checks your request'), how(3, 'Approval', 'Officers approve the LC'), how(4, 'Survey', 'A surveyor is scheduled')),
        h('div', { class: 'grid cols2' },
          h('div', { class: 'card' }, cardHead('send', 'New survey request'),
            h('label', null, 'Substation'), subs, h('label', null, 'What do you need surveyed?'), title, h('label', null, 'Preferred date'), calBox, chosen,
            h('p', { class: 'hint' }, 'Your date is a request. It is confirmed after review and approval.'),
            h('div', { class: 'actions' }, h('button', { onclick: guard(async () => {
              if (!date) throw new Error('Please pick a preferred date.');
              const r = await api('POST', '/portal/api/requests', { substation_id: Number(subs.value), survey_date: date, title: title.value });
              toast(`Request ${r.request.code} received.`); title.value = ''; await load();
            }) }, icon('send'), 'Send request'))),
          h('div', { class: 'card' }, cardHead('activity', 'My requests', `${state.requests.length} in total`),
            state.requests.length ? h('div', null, state.requests.map((r) => h('div', { class: 'preq' },
              h('div', { class: 'top' }, h('div', null, h('div', { class: 'code' }, r.code), h('div', { class: 'cell-sub' }, `${r.title} · ${r.substation} · ${fmtDate(r.survey_date)}`)),
                h('span', { class: 'pill ' + statusClass(r.status), style: 'margin-left:auto' }, r.status)),
              tracker(r.status))))
              : h('div', { class: 'empty' }, h('span', { class: 'ibox' }, icon('inbox')), h('div', null, 'No requests yet. Your requests will appear here.'))))));
  }

  async function load() { state.requests = (await api('GET', '/portal/api/requests')).requests; render(); }
  function render() {
    app.replaceChildren();
    if (!state.user) { app.append(authView()); return; }
    app.append(h('header', { class: 'ptop' }, brand(),
      h('div', { class: 'right' }, avatar(state.user.name), h('div', null, h('b', null, state.user.name), h('span', null, state.user.email)),
        h('button', { class: 'secondary', onclick: guard(async () => { await api('POST', '/portal/api/logout'); state.user = null; state.mode = 'login'; render(); }) }, icon('logout'), 'Sign out'))), homeView());
  }
  async function start() { state.user = (await api('GET', '/portal/api/me')).user; await load(); }
  api('GET', '/portal/api/me').then(start).catch(() => render());
})();

}
(function(){
  var mode=null;
  function pick(){return location.hash.indexOf('#/portal')===0?'portal':'app';}
  function boot(){var m=pick();if(m===mode)return;mode=m;document.getElementById('app').replaceChildren();
    document.title=m==='portal'?'Request a Substation Survey':'KPTCL CMS · Survey Management (standalone demo)';
    (m==='portal'?runPortal:runApp)();}
  window.addEventListener('hashchange',boot);boot();
})();
</script></body></html>
